[project]
name = "projet-belvedere"
version = "0.1.0"
description = "Projet Hôtel Belvédère - permet de répondre à des questions personnalisées sur l'hôtel"
readme = "README.md"
authors = [
    { name = "sandrine", email = "sand.bellicaud@laposte.net" }
]
requires-python = ">=3.13.2"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.3",
    "pyinstaller>=6.22.3",
    "pypdf>=6.14.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
projet-belvedere = "projet_belvedere.main:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
